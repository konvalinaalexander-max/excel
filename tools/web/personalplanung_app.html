<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Personalplanung</title>
<style>
/* Layout: Arbeitsmappe wie Excel – grüne Titelleiste, Bearbeitungszeile, Blatt, Blattregister unten mit Statusleiste */
:root{
  --font:Calibri,Carlito,"Segoe UI",system-ui,sans-serif; --hatch:rgba(0,0,0,.07);
  --bg:#f3f2f1; --sheet:#ffffff; --fg:#1f1f1f; --fg-2:#555555; --fg-3:#8a8886;
  --line:#e1dfdd; --line-2:#c8c6c4; --head:#f3f2f1; --head-fg:#3b3a39;
  --accent:#107c41; --accent-ink:#ffffff; --accent-soft:#e6f2ea; --kw-tint:rgba(16,124,65,.10);
  --sel:#107c41; --sel-fill:rgba(16,124,65,.12); --note:#c42b1c;
  --bad-bg:#fbd5d5; --bad-fg:#9c0006; --warn-bg:#ffe8a3; --warn-fg:#6b4f00; --ok-bg:#dff0e3; --ok-fg:#1e6b38;
  --EIC:#ddebf7; --JUC:#e7e6e6; --FEL:#d5e8e4; --FRE:#e2efda; --TOM:#fbe5d6; --BLU:#fff2cc; --LOG:#efe6d8;
  --F:#dcd3ec; --K:#f4cccc; --U:#e6b8b7;
  --STK:#d9ead3; --F10:#cfe2f3; --F13:#d0e0e3; --VER:#fce5cd; --LUC:#efe6d8; --NOG:#fbd5d5;
  --chart-ist:#9dc3e6; --chart-soll:#1f3864; --shadow:0 10px 28px rgba(0,0,0,.16);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1b1b; --sheet:#242424; --fg:#ececec; --fg-2:#bdbdbd; --fg-3:#8f8f8f;
  --line:#383838; --line-2:#4a4a4a; --head:#2c2c2c; --head-fg:#d0d0d0;
  --accent:#2f9e5f; --accent-ink:#ffffff; --accent-soft:#1d3527; --kw-tint:rgba(76,194,127,.14);
  --sel:#4cc27f; --sel-fill:rgba(76,194,127,.16); --note:#ff6b5b;
  --bad-bg:#5a2326; --bad-fg:#ffb3b3; --warn-bg:#55461a; --warn-fg:#ffe08a; --ok-bg:#1f4029; --ok-fg:#a7e3b9;
  --EIC:#253a52; --JUC:#3a3a3a; --FEL:#244540; --FRE:#2d4327; --TOM:#4f3527; --BLU:#4d4322; --LOG:#463d2f;
  --F:#3d3456; --K:#562c2c; --U:#53303a;
  --STK:#2d4327; --F10:#253a52; --F13:#234246; --VER:#4f3b25; --LUC:#463d2f; --NOG:#5a2326;
  --chart-ist:#3f6f99; --chart-soll:#dfe7f5; --shadow:0 10px 28px rgba(0,0,0,.5); --hatch:rgba(255,255,255,.07); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1b1b; --sheet:#242424; --fg:#ececec; --fg-2:#bdbdbd; --fg-3:#8f8f8f;
  --line:#383838; --line-2:#4a4a4a; --head:#2c2c2c; --head-fg:#d0d0d0;
  --accent:#2f9e5f; --accent-ink:#ffffff; --accent-soft:#1d3527; --kw-tint:rgba(76,194,127,.14);
  --sel:#4cc27f; --sel-fill:rgba(76,194,127,.16); --note:#ff6b5b;
  --bad-bg:#5a2326; --bad-fg:#ffb3b3; --warn-bg:#55461a; --warn-fg:#ffe08a; --ok-bg:#1f4029; --ok-fg:#a7e3b9;
  --EIC:#253a52; --JUC:#3a3a3a; --FEL:#244540; --FRE:#2d4327; --TOM:#4f3527; --BLU:#4d4322; --LOG:#463d2f;
  --F:#3d3456; --K:#562c2c; --U:#53303a;
  --STK:#2d4327; --F10:#253a52; --F13:#234246; --VER:#4f3b25; --LUC:#463d2f; --NOG:#5a2326;
  --chart-ist:#3f6f99; --chart-soll:#dfe7f5; --shadow:0 10px 28px rgba(0,0,0,.5); --hatch:rgba(255,255,255,.07); color-scheme:dark}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.35}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--fg-3)}
.sp{flex:1}

/* Titelleiste */
.appbar{background:var(--accent);color:var(--accent-ink);padding-block:7px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.logo{width:24px;height:24px;border-radius:4px;background:var(--accent-ink);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700}
.demo{font-size:11px;font-weight:400;border:1px solid rgba(255,255,255,.55);border-radius:10px;padding:1px 8px;white-space:nowrap}
.roles{display:flex;gap:2px;background:rgba(0,0,0,.16);border-radius:6px;padding:2px;flex-wrap:wrap}
.roles button{border:0;background:transparent;color:var(--accent-ink);padding:4px 10px;border-radius:4px;font-size:13px}
.roles button[aria-pressed="true"]{background:var(--accent-ink);color:var(--accent);font-weight:700}
.tools{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tools button{border:1px solid rgba(255,255,255,.45);background:transparent;color:var(--accent-ink);border-radius:4px;padding:3px 10px;font-size:13px}
.tools button:disabled{opacity:.45;cursor:default}

/* Bearbeitungszeile */
.fbar{background:var(--sheet);border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:8px;padding-block:4px;font-size:13px;min-height:30px}
.namebox{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:2px;background:var(--sheet)}
.namebox button{border:0;background:transparent;padding:2px 7px;color:var(--fg-2)}
.namebox span{min-width:52px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.fx{color:var(--fg-3);font-style:italic;padding:0 6px;border-left:1px solid var(--line-2);border-right:1px solid var(--line-2)}
.fxtext{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}

/* Blatt */
main{flex:1;min-height:0;display:flex;flex-direction:column}
.sheet{flex:1;min-height:0;overflow:auto;padding-block:14px}
.sheet.fill{display:flex;flex-direction:column;gap:10px;overflow:hidden}
.sheet h2{font-size:18px;margin:0;font-weight:700;text-wrap:balance}
.sheet h3{font-size:14px;margin:0 0 8px;font-weight:700;letter-spacing:.02em}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.toolbar label{font-size:13px;color:var(--fg-2);display:flex;align-items:center;gap:6px}
.toolbar input[type="search"],.toolbar select,.inp{border:1px solid var(--line-2);border-radius:3px;background:var(--sheet);padding:3px 6px;font-size:13px}
.btn{border:1px solid var(--line-2);background:var(--sheet);border-radius:3px;padding:4px 10px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:4px 10px;font-size:13px;border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.lock{font-size:12px;color:var(--fg-2);border:1px dashed var(--line-2);border-radius:3px;padding:2px 8px}
.legend{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11px}
.legend .k{padding:1px 6px;border-radius:2px;border:1px solid var(--line)}

/* Tabellen wie Excel */
.gridwrap{position:relative;overflow:auto;border:1px solid var(--line-2);background:var(--sheet);flex:1;min-height:200px}
.gridwrap.auto{flex:none;max-height:none;min-height:0}
table.xl{border-collapse:separate;border-spacing:0;font-size:12px;font-variant-numeric:tabular-nums}
.xl th,.xl td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 5px;height:22px;white-space:nowrap;text-align:left}
.xl thead th{position:sticky;background:var(--head);color:var(--head-fg);font-weight:400;z-index:2;top:0}
.xl thead tr.r2 th{top:23px}
.xl thead th.kw{text-align:center;padding:0;min-width:34px;font-weight:700}
.xl thead th.kw.now{background:var(--accent-soft);color:var(--accent)}
.xl thead th.mo{text-align:left;font-size:11px;color:var(--fg-2)}
.xl .st0{position:sticky;left:0;z-index:1;background:var(--head);color:var(--fg-3);text-align:right;min-width:30px;font-size:11px}
.xl .st1{position:sticky;left:31px;z-index:1;background:var(--sheet);min-width:170px;max-width:200px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line-2)}
.xl thead .st0,.xl thead .st1{z-index:3;background:var(--head)}
.xl tbody tr:hover td.st1{background:var(--accent-soft)}
.xl td.c{width:34px;min-width:34px;max-width:34px;padding:0;text-align:center;font-size:11px;cursor:cell;position:relative;overflow:hidden;user-select:none}
.xl td.c.small{font-size:9px;letter-spacing:-.02em}
.xl td.kwc{box-shadow:inset 0 0 0 9999px var(--kw-tint)}
.xl td.sel{box-shadow:inset 0 0 0 9999px var(--sel-fill)}
.xl td.has-note::after{content:"";position:absolute;top:0;right:0;border-top:6px solid var(--note);border-left:6px solid transparent}
.xl td.away{color:var(--fg-3);font-size:9px}
.xl td.num{text-align:center;padding:0 2px;min-width:34px}
.xl td.ed{cursor:text}
.xl td.ed:hover{outline:1px solid var(--sel);outline-offset:-1px}
.xl td.ed input{width:100%;height:20px;border:0;outline:2px solid var(--sel);text-align:center;background:var(--sheet);font-size:12px;padding:0}
.xl tr.sum td{font-weight:700}
.xl tr.sec td{background:var(--head);font-weight:700;color:var(--head-fg)}
.xl td.lbl{position:sticky;left:0;z-index:1;background:var(--sheet);min-width:210px;border-right:1px solid var(--line-2)}
.xl td.lbl.g{background:var(--FRE)}
.xl td.sub{color:var(--fg-2)}
.xl td.bad,.xl .bad{background:var(--bad-bg);color:var(--bad-fg);font-weight:700}
.xl td.warn,.xl .warn{background:var(--warn-bg);color:var(--warn-fg)}
.k-EIC{background:var(--EIC)}.k-JUC{background:var(--JUC)}.k-FEL{background:var(--FEL)}.k-FRE{background:var(--FRE)}
.k-TOM{background:var(--TOM)}.k-BLU{background:var(--BLU)}.k-LOG{background:var(--LOG)}
.k-F{background:var(--F);font-weight:700}.k-K{background:var(--K);font-weight:700}.k-U{background:var(--U);font-weight:700}
.k-STK{background:var(--STK)}.k-F10{background:var(--F10)}.k-F13{background:var(--F13)}.k-VER{background:var(--VER)}.k-LUC{background:var(--LUC)}
.k-NOG{background:var(--NOG)}
td.pair{background:linear-gradient(135deg,var(--x) 0 50%,var(--y) 50% 100%)}
.selrect{position:absolute;border:2px solid var(--sel);pointer-events:none;z-index:4;display:none}
.pa{color:var(--fg-3);font-size:11px;margin-left:4px}
.hbchip{display:inline-block;padding:0 6px;border-radius:2px;font-size:11px}

/* Kacheln, Karten */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--line-2);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.tile .lab{font-size:12px;color:var(--fg-2);text-transform:uppercase;letter-spacing:.06em}
.tile .val{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .sub{font-size:12px;color:var(--fg-2)}
.panel{background:var(--sheet);border:1px solid var(--line-2);border-radius:4px;padding:12px 14px;min-width:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.st{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap}
.st.bad{background:var(--bad-bg);color:var(--bad-fg)}.st.warn{background:var(--warn-bg);color:var(--warn-fg)}.st.ok{background:var(--ok-bg);color:var(--ok-fg)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);border-radius:3px;padding:3px 8px;font-size:12px;color:var(--fg)}
.chip span{color:var(--fg-2)}
.chip[aria-pressed="true"]{outline:2px solid var(--sel);outline-offset:1px;font-weight:700}
.chip.plain{background:var(--sheet)}
.chip:disabled{opacity:.45;cursor:default}

/* Diagramme */
.chart-legend{display:flex;gap:14px;font-size:12px;color:var(--fg-2);align-items:center;margin-bottom:4px}
.sw{display:inline-block;width:12px;height:10px;border-radius:2px;background:var(--chart-ist);vertical-align:middle;margin-right:4px}
.sw.line{height:2px;background:var(--chart-soll);border-radius:0}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{fill:var(--fg-2);font-size:10px;font-family:var(--font)}
svg.ch .grid{stroke:var(--line);stroke-width:1}
svg.ch .bar{fill:var(--chart-ist)}
svg.ch .soll{stroke:var(--chart-soll);stroke-width:2;fill:none;stroke-linejoin:round}
svg.ch .kwband{fill:var(--kw-tint)}
svg.ch .dot{fill:var(--chart-soll);stroke:var(--sheet);stroke-width:2}
svg.ch .hit{fill:transparent}

/* Planungsbrett */
.board{display:flex;gap:10px;overflow-x:auto;align-items:flex-start;padding-bottom:10px;flex:1;min-height:0}
.lane{flex:0 0 228px;background:var(--sheet);border:1px solid var(--line-2);border-radius:4px;display:flex;flex-direction:column;max-height:100%}
.lane.over{outline:2px dashed var(--sel);outline-offset:2px}
.lane-h{padding:8px 10px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px;border-radius:4px 4px 0 0}
.lane-h .t{display:flex;align-items:baseline;gap:6px;font-weight:700}
.lane-h .t small{font-weight:400;color:var(--fg-2)}
.lane-h .row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2);flex-wrap:wrap}
.step{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:3px;background:var(--sheet)}
.step button{border:0;background:transparent;width:22px;height:22px;color:var(--fg)}
.step b{min-width:26px;text-align:center;font-variant-numeric:tabular-nums;color:var(--fg)}
.cards{padding:8px;display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:48px}
.card{background:var(--sheet);border:1px solid var(--line-2);border-radius:3px;padding:5px 8px;display:flex;align-items:center;gap:6px;cursor:grab;font-size:13px;text-align:left}
.card:hover{border-color:var(--sel)}
.card.borrowed{border-style:dashed}
.card .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .fm{font-size:10px;color:var(--fg-2);border:1px solid var(--line-2);border-radius:2px;padding:0 3px}
.card .tag{font-size:10px;color:var(--fg-2)}
.card .nt{width:7px;height:7px;border-radius:50%;background:var(--note)}
.empty{font-size:12px;color:var(--fg-3);padding:4px 2px}

/* Popover, Tooltip, Toast, Schublade */
.pop{position:fixed;z-index:20;background:var(--sheet);border:1px solid var(--line-2);border-radius:6px;box-shadow:var(--shadow);width:min(360px,calc(100vw - 32px));max-height:calc(100% - 32px);overflow:auto}
.pop-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.pop-h strong{flex:1}
.pop-h button{border:0;background:transparent;font-size:18px;line-height:1;color:var(--fg-2)}
.pop-sec{padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.pop-sec .lbl{font-size:12px;color:var(--fg-2)}
.pop-sec textarea,.pop-sec input,.pop-sec select{border:1px solid var(--line-2);border-radius:3px;background:var(--sheet);padding:4px 6px;font-size:13px;width:100%;box-sizing:border-box}
.pop-f{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.preview{font-size:12px;color:var(--fg-2)}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--sheet);color:var(--fg);border:1px solid var(--line-2);border-radius:4px;box-shadow:var(--shadow);padding:6px 9px;font-size:12px;max-width:260px}
.tip b{font-variant-numeric:tabular-nums}
.toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(52px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--sheet);padding:8px 14px;border-radius:4px;font-size:13px;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 32px)}
.toast button{border:0;background:transparent;color:var(--sheet);font-weight:700;text-decoration:underline}
.drawer{position:fixed;z-index:25;top:0;right:0;bottom:0;width:min(380px,100vw);background:var(--sheet);border-left:1px solid var(--line-2);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer .pop-h{padding:12px 16px}
.drawer .body{overflow:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:10px}
.logi{font-size:13px;border-bottom:1px solid var(--line);padding-bottom:8px}
.logi .meta{font-size:11px;color:var(--fg-3)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--fg-2)}
.form .full{grid-column:1/-1}

/* Blattregister + Statusleiste */
.tabbar{display:flex;align-items:stretch;background:var(--bg);border-top:1px solid var(--line-2);gap:2px;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{border:0;background:transparent;color:var(--fg-2);padding:7px 14px;border-bottom:3px solid transparent;white-space:nowrap;font-size:13px}
.tab[aria-selected="true"]{background:var(--sheet);color:var(--accent);font-weight:700;border-bottom-color:var(--accent)}
.statusbar{margin-left:auto;font-size:12px;color:var(--fg-2);white-space:nowrap;align-self:center;padding-left:16px;font-variant-numeric:tabular-nums}
.tabadd{color:var(--fg-3);align-self:center;padding:0 8px}
table.plain{border-collapse:collapse;font-size:13px;width:100%;font-variant-numeric:tabular-nums}
table.plain th,table.plain td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:middle}
table.plain th{font-size:12px;color:var(--fg-2);font-weight:400}
table.plain td.n{text-align:right}
.tw{overflow-x:auto}
@media (max-width:640px){.statusbar{display:none}.brand .demo{display:none}.sheet.fill{overflow:auto}.gridwrap{min-height:62vh}.board{min-height:70vh}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}
.trow .fm{font-size:10px;color:var(--fg-2);border:1px solid var(--line-2);border-radius:2px;padding:0 3px}
.trow .tag{font-size:10px;color:var(--fg-2)}

/* Ergänzungen für die Arbeitsversion */
.xl .st0{width:38px;min-width:38px;max-width:38px;box-sizing:border-box;padding:0 5px 0 2px}
.xl .st1{left:38px}
.lane{flex:1 0 190px;max-width:270px}
.xl td.out{background-image:repeating-linear-gradient(45deg,transparent 0 4px,var(--hatch) 4px 6px)}
.xl th.sortable{cursor:pointer}
.xl th.sortable:hover{color:var(--accent)}
.xl td.sd{cursor:text;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.xl td.sd:hover{outline:1px solid var(--sel);outline-offset:-1px}
.xl td.sd input,.xl td.sd select{width:100%;box-sizing:border-box;height:20px;border:0;outline:2px solid var(--sel);background:var(--sheet);font-size:12px}
.xl td.calc{color:var(--fg-3);text-align:center}
.xl td.txt{white-space:normal;min-width:120px;max-width:280px;line-height:1.25;padding-block:3px}
.card.grey{background:var(--head);color:var(--fg-2);border-style:dotted}
.card.grey .nm{color:var(--fg-2)}
.lane-div{font-size:11px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.06em;padding:6px 2px 0;border-top:1px dashed var(--line-2);margin-top:4px}
.lane.drop-only{flex:0 0 150px}
.lane.drop-only .cards{min-height:120px;align-items:center;justify-content:center;color:var(--fg-3);font-size:12px;text-align:center}
.save{font-size:12px;border:1px solid rgba(255,255,255,.55);border-radius:10px;padding:1px 9px;white-space:nowrap;background:transparent;color:var(--accent-ink)}
.save.err{background:#c42b1c;border-color:#c42b1c}
.start{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.start .box{background:var(--sheet);border:1px solid var(--line-2);border-radius:6px;max-width:640px;width:100%;padding:24px 26px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.start h1{margin:0;font-size:22px;color:var(--accent)}
.start p{margin:0;line-height:1.5}
.start .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.start .msg{border-left:3px solid var(--note);padding:6px 10px;background:var(--bad-bg);color:var(--bad-fg)}
.start ol{margin:0;padding-left:20px;line-height:1.6}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.trow{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:3px;padding:4px 6px;background:var(--sheet);font-size:13px}
.trow.grey{background:var(--head);color:var(--fg-2);border-style:dotted}
.trow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow button{border:1px solid var(--line-2);background:var(--sheet);border-radius:3px;font-size:11px;padding:1px 6px}
.xs{font-size:12px;color:var(--fg-2)}
.inl{border:1px solid var(--line-2);border-radius:3px;background:var(--sheet);padding:2px 5px;font-size:13px}
.del{border:0;background:transparent;color:var(--fg-3);font-size:15px;line-height:1}
.del:hover{color:var(--note)}
h3 .n{font-weight:400;color:var(--fg-3)}
[data-tedit],[data-aedit]{cursor:text}
@media print{.appbar,.fbar,.tabbar,.toolbar .btn,.toolbar .seg,.lock,.pop,.drawer,.toast,.start{display:none!important}body{display:block;height:auto}.sheet,.sheet.fill,.gridwrap{overflow:visible!important;max-height:none!important}}
.secnav{display:flex;gap:6px;flex-wrap:wrap}
.secnav a{font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--line-2);border-radius:3px;padding:2px 8px;background:var(--sheet)}
</style>

<body>
<header class="appbar gut">
  <div class="brand"><span class="logo" aria-hidden="true">PP</span>Personalplanung<button class="save" id="save" title="Speicherstand">–</button></div>
  <div class="roles" id="roles" role="group" aria-label="Ansicht als"></div>
  <div class="tools">
    <button id="b-undo" title="Rückgängig (Ctrl+Z)">↶ Rückgängig</button>
    <button id="b-redo" title="Wiederholen (Ctrl+Y)">↷</button>
    <button id="b-log">Verlauf</button>
  </div>
</header>
<div class="fbar gut">
  <div class="namebox"><button id="kw-prev" aria-label="Woche zurück">‹</button><span id="kw-lab">KW</span><button id="kw-next" aria-label="Woche vor">›</button></div>
  <select id="yr-sel" class="inp" aria-label="Jahr"></select>
  <span class="fx">fx</span>
  <div class="fxtext" id="fx"></div>
</div>
<main id="view"></main>
<nav class="tabbar gut" id="tabs" role="tablist" aria-label="Blätter"></nav>
<div id="pop" class="pop" hidden></div>
<div id="tip" class="tip" hidden></div>
<div id="toast" class="toast" hidden></div>
<aside id="drawer" class="drawer" hidden></aside>
<div id="start" class="start"></div>
<input type="file" id="file-in" accept=".json,application/json" hidden>

<script>
'use strict';
/* =====================================================================
   Personalplanung – Arbeitsversion
   Daten: personalplanung-daten.json im gewählten Ordner (Netzlaufwerk).
   Speichern: File System Access (Edge/Chrome), mit Versionsprüfung,
   Zusammenführen bei gleichzeitigem Speichern und täglicher Sicherung.
   ===================================================================== */
const FILE = 'personalplanung-daten.json', BACKUPDIR = 'Sicherungen', UIKEY = 'pp-ui-v2';
const AREAS = [
  {c:'EIC',n:'Kräuter Eichhof',k:'Eichhof'},{c:'JUC',n:'Kräuter Juch',k:'Juch'},{c:'FEL',n:'Kräuter Feld',k:'Feld'},
  {c:'FRE',n:'Gemüse Freiland',k:'Freiland'},{c:'TOM',n:'Tomaten',k:'Tomaten'},{c:'BLU',n:'Blumen',k:'Blumen'},{c:'LOG',n:'Logistik',k:'Logistik'}];
const AREA = Object.fromEntries(AREAS.map(a => [a.c, a]));
const STATUS = [{c:'F',n:'Ferien'},{c:'K',n:'Krank'},{c:'U',n:'Unfall'}];
const STN = Object.fromEntries(STATUS.map(s => [s.c, s.n]));
const ABS = new Set(['F','K','U']);
const GROUPS = [{c:'STK',n:'Steckling',fm:'F'},{c:'F10',n:'Fax 10.5er',fm:'F'},{c:'F13',n:'Fax 13er',fm:'F'},
  {c:'VER',n:'Verteilen / Topf',fm:'M'},{c:'LUC',n:'Luchs',fm:'M'}];
const GROUP = Object.fromEntries(GROUPS.map(g => [g.c, g]));
const ROLES = {hr:{n:'Personalchefin',tab:'personal'}, kr:{n:'Kräuter Eichhof',tab:'kraeuter'}, ge:{n:'Gemüse Freiland',tab:'gemuese'}};
const TABS = [{id:'personal',n:'Personal'},{id:'uebersicht',n:'Übersicht'},{id:'sitzung',n:'Personalsitzung'},
  {id:'kraeuter',n:'Kräuter Eichhof'},{id:'gemuese',n:'Gemüse Freiland'}];
const OWNER = {personal:'hr', uebersicht:'hr', sitzung:'hr', kraeuter:'kr', gemuese:'ge'};
const MUT_TYPEN = ['Eintritte','Neueintritte','Wiedereintritte','Austritte','Austritte (Kündigung MA)','Absenzen','Wechsel','Anfrage Verlängerung'];
const BEW_ST = ['neu','Gespräch','zugesagt','abgesagt','angelegt'];
const SHOW = [['alle','alle Personen'],['jahr','im gewählten Jahr dabei'],['angestellt','angestellt in der Woche'],['da','da in der Woche (arbeitet)'],
  ['abwesend','abwesend in der Woche (F/K/U)'],['leer','angestellt, aber nicht eingeplant'],['ein','Eintritt in der Woche'],['aus','Austritt in der Woche'],['aus4','Austritt in den nächsten 4 Wochen']];

/* ---------- Hilfsfunktionen ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1 = x => Math.round((x + Number.EPSILON) * 10) / 10;
const fmt = x => { x = r1(x); return String(Math.abs(x) < 1e-9 ? 0 : x).replace('.', ','); };
const fmtD = x => { x = r1(x); return x > 0 ? '+' + fmt(x) : x < 0 ? '−' + fmt(-x) : '0'; };
const cls = x => x < -0.5 ? 'bad' : x > 0.5 ? 'warn' : '';
function stTxt(x){ x = r1(x);
  if (x < -0.5) return `<span class="st bad">▼ ${fmt(-x)} ${-x === 1 ? 'fehlt' : 'fehlen'}</span>`;
  if (x > 0.5) return `<span class="st warn">▲ ${fmt(x)} zu viel</span>`;
  return `<span class="st ok">✓ passt</span>`; }
const name = p => `${p.vn} ${p.nn}`.trim();
const grpName = c => c ? c.split('/').map(x => GROUP[x] ? GROUP[x].n : x).join(' / ') : 'Noch ohne Gruppe';
const areaTxt = c => (c || '').split('/').map(x => AREA[x] ? AREA[x].k : STN[x] || x).join(' / ');
const fmLong = f => f === 'F' ? 'Frau' : f === 'M' ? 'Mann' : '–';
const P = (dd, id) => dd.personen.find(x => x.id === id);
const MON = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const iso = dt => dt.toISOString().slice(0, 10);
const addDays = (dt, n) => new Date(dt.getTime() + n * 864e5);
const fmtDate = s => s ? `${s.slice(8, 10)}.${s.slice(5, 7)}.${s.slice(2, 4)}` : '';
function mondayOf(y, kw){ const j4 = Date.UTC(y, 0, 4); const dow = (new Date(j4).getUTCDay() + 6) % 7; return new Date(j4 - dow * 864e5 + (kw - 1) * 7 * 864e5); }
function isoWeek(dt){ const x = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate())); const day = (x.getUTCDay() + 6) % 7;
  x.setUTCDate(x.getUTCDate() - day + 3); const y = x.getUTCFullYear(); const f = new Date(Date.UTC(y, 0, 4));
  return {y, w:1 + Math.round(((x - f) / 864e5 - 3 + ((f.getUTCDay() + 6) % 7)) / 7)}; }

/* ---------- Daten und Zustand ---------- */
let d = null;
const ui = {tab:'personal', role:'hr', user:'', year:null, kw:null, pView:'plan', show:'alle', hb:'', fm:'', zu:'', q:'',
  sortK:'', sortD:1, krView:'woche', krScope:'woche', krBis:null, krShow:'alle', chartArea:'ALL', hireFrom:null, hireTo:null, bedArea:'BLU', fx:''};
try { Object.assign(ui, JSON.parse(lsGet(UIKEY) || '{}')); } catch (e) {}
ui.fx = '';
if (location.hash && TABS.some(t => '#' + t.id === location.hash)) ui.tab = location.hash.slice(1);
const saveUi = () => { const {fx, ...rest} = ui; lsSet(UIKEY, JSON.stringify(rest)); };

const Y = () => d.jahre.find(j => j.y === ui.year) || d.jahre[0];
const tOf = (y, kw) => (d.jahre.find(j => j.y === y) || d.jahre[0]).off + kw - 1;
const tNow = () => Y().off + ui.kw - 1;
const WK = () => { const j = Y(); return Array.from({length:j.n}, (_, i) => j.off + i); };
function ytOf(t){ for (const j of d.jahre) if (t >= j.off && t < j.off + j.n) return {y:j.y, kw:t - j.off + 1}; return {y:d.jahre[0].y, kw:1}; }
const monT = t => { const o = ytOf(t); return mondayOf(o.y, o.kw); };
const kwT = t => ytOf(t).kw;
const dmyT = t => { const m = monT(t); return `${String(m.getUTCDate()).padStart(2, '0')}.${String(m.getUTCMonth() + 1).padStart(2, '0')}.`; };
const monthT = t => addDays(monT(t), 3).getUTCMonth();
const kwLbl = t => { const o = ytOf(t); return `KW ${o.kw}${o.y !== ui.year ? ' / ' + o.y : ''}`; };
function inContract(p, t){ if (!p.ein && !p.aus) return false; const mo = iso(monT(t)), su = iso(addDays(monT(t), 6));
  return (!p.ein || p.ein <= su) && (!p.aus || p.aus >= mo); }
const employed = (p, t) => inContract(p, t) || !!p.w[t];
const inWeek = (s, t) => !!s && s >= iso(monT(t)) && s <= iso(addDays(monT(t), 6));
const tOfDate = s => { if (!s) return null; const o = isoWeek(new Date(s + 'T12:00:00')); const j = d.jahre.find(x => x.y === o.y); return j && o.w <= j.n ? j.off + o.w - 1 : null; };
function initWeek(){
  const now = isoWeek(new Date());
  if (!d.jahre.some(j => j.y === ui.year)) { const j = d.jahre.find(x => x.y === now.y); ui.year = j ? j.y : d.jahre[0].y; ui.kw = j ? Math.min(now.w, j.n) : 1; }
  ui.kw = Math.max(1, Math.min(Y().n, ui.kw || 1));
  if (!ui.hireFrom || ui.hireFrom > Y().n) ui.hireFrom = Math.min(Y().n, ui.kw + 1);
  if (!ui.hireTo || ui.hireTo > Y().n) ui.hireTo = Math.min(Y().n, ui.kw + 12);
  if (!ui.krBis) ui.krBis = Math.min(Y().n, ui.kw + 2);
}
const can = tab => OWNER[tab] === ui.role;

/* ---------- Speichern (Ordner auf dem Netzlaufwerk) ---------- */
const FS = 'showDirectoryPicker' in window;
const store = {mode:'none', dir:null, version:0, lastMod:0, pending:[], saving:false, timer:null, state:'', savedAt:null, by:''};
let past = [], future = [], backupDay = null, pollT = null;
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open('personalplanung', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k){ const db = await idb(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbSet(k, v){ const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
function setSave(state, info){
  store.state = state; const b = $('#save'); b.classList.toggle('err', state === 'error' || state === 'local');
  const t = store.savedAt ? new Date(store.savedAt).toLocaleTimeString('de-CH', {hour:'2-digit', minute:'2-digit'}) : '';
  b.textContent = state === 'saving' ? 'speichert …' : state === 'pending' ? 'Änderung …' : state === 'saved' ? `● gespeichert ${t}`
    : state === 'error' ? 'nicht gespeichert – erneut versuchen' : state === 'local' ? 'Arbeitskopie – Speichern' : '–';
  b.title = info || (store.dir ? `Ordner: ${store.dir.name} · Datei: ${FILE}` : '');
}
function commit(msg, fn){
  if (!d) return;
  past.push(JSON.stringify(d)); if (past.length > 40) past.shift(); future = [];
  const op = dd => { fn(dd); if (msg){ dd.log.unshift({t:new Date().toISOString(), r:ROLES[ui.role].n, u:ui.user || '', x:msg}); if (dd.log.length > 5000) dd.log.length = 5000; } };
  op(d); queueSave({fn:op}); render();
}
function queueSave(op){
  if (store.mode === 'file'){ setSave('local'); return; }
  if (store.mode !== 'fs') return;
  store.pending.push(op); setSave('pending'); clearTimeout(store.timer); store.timer = setTimeout(flush, 600);
}
async function readFile(){ const fh = await store.dir.getFileHandle(FILE, {create:true}); const f = await fh.getFile(); return {fh, f, text:await f.text()}; }
async function flush(){
  if (store.mode !== 'fs' || store.saving || !store.pending.length) return;
  store.saving = true; setSave('saving');
  const ops = store.pending.slice();
  try {
    const {fh, text} = await readFile();
    let cur = null; try { cur = JSON.parse(text); } catch (e) { cur = null; }
    if (cur && cur.data && (cur.version || 0) !== store.version){
      const fresh = cur.data; let lost = 0;
      for (const op of store.pending){ if (op.replace){ lost++; continue; } try { op.fn(fresh); } catch (e) { lost++; } }
      d = fresh; store.version = cur.version || 0; past = []; future = [];
      toast(`${cur.von || 'Jemand'} hat inzwischen gespeichert. Deine Änderungen wurden dazugenommen${lost ? ` (${lost} Schritt${lost > 1 ? 'e' : ''} nicht möglich)` : ''}.`);
    }
    await backup(text);
    const now = new Date().toISOString();
    const out = {format:'personalplanung', version:store.version + 1, gespeichert:now, von:ui.user || ROLES[ui.role].n, data:d};
    const w = await fh.createWritable(); await w.write(JSON.stringify(out)); await w.close();
    store.version += 1; store.savedAt = now; store.by = out.von;
    store.pending.splice(0, ops.length);
    const f2 = await fh.getFile(); store.lastMod = f2.lastModified;
    setSave(store.pending.length ? 'pending' : 'saved');
  } catch (e) {
    setSave('error', 'Speichern fehlgeschlagen: ' + (e && e.message ? e.message : e));
    clearTimeout(store.timer); store.timer = setTimeout(flush, 10000);
  } finally {
    store.saving = false;
    if (store.pending.length && store.state !== 'error') store.timer = setTimeout(flush, 400);
    render();
  }
}
async function backup(text){
  const day = new Date().toISOString().slice(0, 10);
  if (backupDay === day || !text) return;
  try { const bd = await store.dir.getDirectoryHandle(BACKUPDIR, {create:true}); const nm = `personalplanung-daten_${day}.json`;
    let exists = true; try { await bd.getFileHandle(nm); } catch (e) { exists = false; }
    if (!exists){ const fh = await bd.getFileHandle(nm, {create:true}); const w = await fh.createWritable(); await w.write(text); await w.close(); }
    backupDay = day; } catch (e) { /* Sicherung ist nicht kritisch */ }
}
async function checkRemote(){
  if (store.mode !== 'fs' || store.saving || store.pending.length || document.hidden) return;
  if (!$('#pop').hidden || (document.activeElement && document.activeElement.closest('input,textarea,select') && document.activeElement.closest('#view,#drawer'))) return;
  try { const {f, text} = await readFile(); if (f.lastModified === store.lastMod) return;
    const obj = JSON.parse(text); store.lastMod = f.lastModified;
    if ((obj.version || 0) === store.version || !obj.data) return;
    d = obj.data; store.version = obj.version || 0; store.savedAt = obj.gespeichert; past = []; future = [];
    render(); setSave('saved'); toast(`Neue Änderungen geladen${obj.von ? ' (von ' + obj.von + ')' : ''}.`);
  } catch (e) { /* nächster Versuch */ }
}
function startPolling(){ clearInterval(pollT); if (store.mode === 'fs') pollT = setInterval(checkRemote, window.PP_POLL || 20000); }
window.addEventListener('beforeunload', e => { if (store.pending.length || store.saving || store.state === 'local'){ e.preventDefault(); e.returnValue = ''; } });
function validData(obj){ return obj && obj.format === 'personalplanung' && obj.data && Array.isArray(obj.data.personen) && obj.data.jahre; }
async function openFolder(dir){
  let fh = null; try { fh = await dir.getFileHandle(FILE); } catch (e) { fh = null; }
  store.dir = dir;
  if (!fh){ showStart('missing'); return; }
  const f = await fh.getFile(); let obj = null; try { obj = JSON.parse(await f.text()); } catch (e) { obj = null; }
  if (!validData(obj)){ showStart('bad'); return; }
  store.mode = 'fs'; store.version = obj.version || 0; store.lastMod = f.lastModified; store.savedAt = obj.gespeichert;
  d = obj.data; afterLoad(); setSave('saved');
}
function afterLoad(){ $('#start').hidden = true; initWeek(); past = []; future = []; render(); startPolling(); }
async function pickFolder(){
  try { const dir = await window.showDirectoryPicker({id:'personalplanung', mode:'readwrite'}); try { await idbSet('dir', dir); } catch (e) {}
    await openFolder(dir); } catch (e) { if (e && e.name !== 'AbortError') showStart('err', e.message); }
}
async function reconnect(){
  try { const dir = await idbGet('dir'); if (!dir){ showStart('first'); return; }
    const perm = await dir.requestPermission({mode:'readwrite'}); if (perm !== 'granted'){ showStart('first'); return; }
    await openFolder(dir); } catch (e) { showStart('err', e.message); }
}
function readJsonFile(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => { try { res(JSON.parse(r.result)); } catch (e) { rej(e); } }; r.onerror = () => rej(r.error); r.readAsText(file); }); }
let fileTarget = null;
$('#file-in').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  let obj; try { obj = await readJsonFile(file); } catch (err) { showStart('bad'); return; }
  if (!validData(obj)){ showStart('bad'); return; }
  if (fileTarget === 'copy' && store.dir){
    try { const fh = await store.dir.getFileHandle(FILE, {create:true}); const w = await fh.createWritable(); await w.write(JSON.stringify(obj)); await w.close(); await openFolder(store.dir); }
    catch (err) { showStart('err', err.message); }
  } else { store.mode = 'file'; store.version = obj.version || 0; d = obj.data; afterLoad(); setSave('local'); }
});
function downloadData(){
  const out = {format:'personalplanung', version:(store.version || 0) + 1, gespeichert:new Date().toISOString(), von:ui.user || '', data:d};
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], {type:'application/json'})); a.download = FILE;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  store.version += 1; toast('Datei heruntergeladen. Bitte die alte Datei auf dem Netzlaufwerk damit ersetzen.');
}
async function showStart(mode, info){
  const st = $('#start'); st.hidden = false;
  let saved = null; if (FS && mode !== 'missing' && mode !== 'bad'){ try { saved = await idbGet('dir'); } catch (e) { saved = null; } }
  if (FS && !mode) mode = saved ? 'reconnect' : 'first';
  if (!FS) mode = mode === 'bad' ? 'bad' : 'nofs';
  const msg = {missing:`Im Ordner «${esc(store.dir ? store.dir.name : '')}» liegt keine Datei <b>${FILE}</b>. Lege die mitgelieferte Datei hinein oder wähle sie hier aus – sie wird dann in diesen Ordner kopiert.`,
    bad:'Diese Datei ist keine Daten-Datei der Personalplanung.', err:'Das hat nicht geklappt: ' + esc(info || '')}[mode];
  st.innerHTML = `<div class="box"><h1>Personalplanung</h1>
    <p>Die Daten liegen in der Datei <b>${FILE}</b> in einem Ordner auf dem Netzlaufwerk. Alle, die mit der Planung arbeiten, verbinden sich mit demselben Ordner. Jede Änderung wird dort sofort gespeichert, und einmal pro Tag wird eine Sicherung im Unterordner «${BACKUPDIR}» angelegt.</p>
    <div class="row"><label for="st-user" class="xs">Dein Name (erscheint im Verlauf)</label><input id="st-user" class="inp" value="${esc(ui.user)}" placeholder="Vorname Nachname" style="flex:1;min-width:180px"></div>
    ${msg ? `<div class="msg">${msg}</div>` : ''}
    ${mode === 'reconnect' && saved ? `<div class="row"><button class="btn primary" data-st="reconnect">Weiter mit Ordner «${esc(saved.name)}»</button><button class="btn" data-st="pick">Anderen Ordner wählen</button></div>` : ''}
    ${mode === 'first' || mode === 'err' ? `<div class="row"><button class="btn primary" data-st="pick">Ordner auf dem Netzlaufwerk wählen</button></div>` : ''}
    ${mode === 'missing' ? `<div class="row"><button class="btn primary" data-st="copy">Daten-Datei auswählen</button><button class="btn" data-st="pick">Anderen Ordner wählen</button></div>` : ''}
    ${mode === 'nofs' || mode === 'bad' ? `<p>${FS ? '' : 'Dieser Browser kann nicht direkt auf das Netzlaufwerk speichern. Bitte die Datei mit <b>Microsoft Edge</b> oder <b>Google Chrome</b> öffnen.'}</p>

const share = (code, a) => { if (!code) return 0; const p = code.split('/'); return p.includes(a) ? 1 / p.length : 0; };
const grpOf = (p, t) => { const o = d.gw[p.id]; return (o && o[t] !== undefined) ? o[t] : (p.g || ''); };
const hoursSum = t => d.stunden.reduce((s, r) => s + (r.v ? (+r.v[t] || 0) : 0), 0);
function stats(){
  const n = d.T, z = () => new Array(n).fill(0);
  const ist = {}, soll = {}, grp = {};
  for (const a of AREAS){ ist[a.c] = {F:z(), M:z(), T:z()}; soll[a.c] = {F:z(), M:z(), T:z()}; }
  for (const g of GROUPS) grp[g.c] = z(); grp[''] = z();
  const abw = z(), ang = z();
  for (const p of d.personen) for (let t = 0; t < n; t++){
    const c = p.w[t];
    if (c || inContract(p, t)) ang[t]++;
    if (!c) continue;
    if (ABS.has(c)){ abw[t]++; continue; }
    const parts = c.split('/'), s = 1 / parts.length;
    for (const a of parts){ const A = ist[a]; if (!A) continue; A.T[t] += s; if (p.fm === 'F') A.F[t] += s; else if (p.fm === 'M') A.M[t] += s;
      if (a === 'EIC'){ const gv = grpOf(p, t); if (!gv) grp[''][t] += s; else { const gp = gv.split('/'); for (const g of gp) if (grp[g]) grp[g][t] += s / gp.length; } } }
  }
  for (let t = 0; t < n; t++){
    let ef = 0, em = 0; for (const g of GROUPS){ const v = +d.bedarfEIC[g.c][t] || 0; if (g.fm === 'F') ef += v; else em += v; }
    soll.EIC.F[t] = ef; soll.EIC.M[t] = em;
    const tot = r1(hoursSum(t) / (d.std || 52)), f = +d.soll.FRE.F[t] || 0;
    soll.FRE.F[t] = f; soll.FRE.M[t] = Math.max(0, r1(tot - f));
    for (const a of ['JUC','FEL','TOM','BLU','LOG']){ soll[a].F[t] = +d.soll[a].F[t] || 0; soll[a].M[t] = +d.soll[a].M[t] || 0; }
    for (const a of AREAS) soll[a.c].T[t] = soll[a.c].F[t] + soll[a.c].M[t];
  }
  const tot = {ist:{F:z(),M:z(),T:z()}, soll:{F:z(),M:z(),T:z()}};
  for (const a of AREAS) for (const k of ['F','M','T']) for (let t = 0; t < n; t++){ tot.ist[k][t] += ist[a.c][k][t]; tot.soll[k][t] += soll[a.c][k][t]; }
  return {ist, soll, grp, abw, ang, tot};
}

function niceMax(v){ const e = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (v <= m * e) return m * e; return 10 * e; }
function chart(id, title, ist, soll, labels = ['eingeplant (IST)', 'Bedarf (SOLL)']){
  const ts = WK(); charts[id] = {title, ist, soll, labels, ts};
  const W = 640, H = 196, L = 30, R = 6, T = 8, B = 22, pw = W - L - R, ph = H - T - B;
  const max = niceMax(Math.max(1, ...ist, ...soll) * 1.05), n = ist.length, bw = pw / n;
  const y = v => T + ph - (v / max) * ph, x = i => L + i * bw;
  let s = `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">`;
  for (let k = 0; k <= 4; k++){ const v = max * k / 4, yy = y(v); s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 4}" y="${yy + 3}" text-anchor="end">${fmt(v)}</text>`; }
  const kw = ui.kw - 1;
  s += `<rect class="kwband" x="${x(kw)}" y="${T}" width="${bw}" height="${ph}"/>`;
  for (let i = 0; i < n; i++){ const v = ist[i]; if (v <= 0) continue;
    const x0 = x(i) + 1, x1 = x(i) + bw - 1, yt = y(v), yb = y(0), r = Math.min(3, (x1 - x0) / 2, yb - yt);
    s += `<path class="bar" d="M${x0} ${yb}V${yt + r}Q${x0} ${yt} ${x0 + r} ${yt}H${x1 - r}Q${x1} ${yt} ${x1} ${yt + r}V${yb}Z"/>`; }
  s += `<path class="soll" d="${soll.map((v, i) => `${i ? 'L' : 'M'}${(x(i) + bw / 2).toFixed(1)} ${y(v).toFixed(1)}`).join('')}"/>`;
  s += `<circle class="dot" cx="${x(kw) + bw / 2}" cy="${y(soll[kw] || 0)}" r="4"/>`;
  for (let i = 0; i < n; i += 4) s += `<text x="${x(i) + bw / 2}" y="${H - 6}" text-anchor="middle">${i + 1}</text>`;
  for (let i = 0; i < n; i++) s += `<rect class="hit" data-chart="${id}" data-i="${i}" x="${x(i)}" y="${T}" width="${bw}" height="${ph}"/>`;
  return `<div class="chart-legend"><span><span class="sw"></span>${labels[0]}</span><span><span class="sw line"></span>${labels[1]}</span><span class="muted">KW ${ui.year} auf der Achse</span></div>${s}</svg>`;
}

    return `<td class="num ${c}${x === now ? ' kwc' : ''}" data-pick-t="${x}">${o.diff ? (Math.abs(v) < 0.05 ? '·' : fmtD(v)) : fmt(v)}</td>`; }).join('')}</tr>`;
  const dif = (a, b) => a.map((v, i) => v - b[i]);
  const resv = d.krank.map((v, i) => (T.ist.T[i] - T.soll.T[i]) - (+v || 0));
  const gtab = `<div class="panel"><h3>Gesamtbetrieb ${ui.year} <span class="n">· weisse Zeilen kann die Personalchefin ändern</span></h3>
    <div class="gridwrap auto"><table class="xl">${weekHead('<th class="st0" style="min-width:230px;left:0">Gesamtbetrieb</th>', '<th class="st0" style="left:0"></th>')}<tbody>
    ${grow('Angestellt (Verträge)', st.ang, {sum:1})}
    ${grow('IST eingeplant', T.ist.T, {sum:1})}${grow('Frauen', T.ist.F, {sub:1})}${grow('Männer', T.ist.M, {sub:1})}
    ${grow('SOLL Bedarf', T.soll.T, {sum:1})}${grow('Frauen', T.soll.F, {sub:1})}${grow('Männer', T.soll.M, {sub:1})}
    ${grow('IST − SOLL', dif(T.ist.T, T.soll.T), {sum:1, diff:1})}${grow('Frauen', dif(T.ist.F, T.soll.F), {sub:1, diff:1})}${grow('Männer', dif(T.ist.M, T.soll.M), {sub:1, diff:1})}
    ${grow('Abwesend (Ferien, Krank, Unfall)', st.abw)}
    ${grow('Reserve Krank (Ø Vorjahre)', d.krank, {edit:'krank'})}
    ${grow('IST − SOLL inkl. Reserve', resv, {sum:1, diff:1})}
    ${grow('Vorjahr: Verträge (Mobatime)', d.vj, {edit:'vj'})}</tbody></table></div></div>`;
  const a = ui.chartArea, aName = a === 'ALL' ? 'Gesamtbetrieb' : AREA[a].n;
  const chips = `<div class="chips" role="group" aria-label="Bereich für Grafik">${[{c:'ALL',k:'Gesamtbetrieb'}, ...AREAS].map(x =>
    `<button class="chip ${x.c === 'ALL' ? 'plain' : 'k-' + x.c}" data-chart-area="${x.c}" aria-pressed="${a === x.c}">${x.k}</button>`).join('')}</div>`;
  const charts2 = `<div class="cols">
    <div class="panel"><h3>Frauen · ${esc(aName)}</h3>${chart('cf', 'Frauen ' + aName, yr(series(st, a, 'ist', 'F')), yr(series(st, a, 'soll', 'F')))}</div>
    <div class="panel"><h3>Männer · ${esc(aName)}</h3>${chart('cm', 'Männer ' + aName, yr(series(st, a, 'ist', 'M')), yr(series(st, a, 'soll', 'M')))}</div></div>`;
  // Wen anstellen?
  const n = Y().n, f0 = Math.max(1, Math.min(n, ui.hireFrom)), t0 = Math.max(f0, Math.min(n, ui.hireTo));
  const res = {F:{n:0, max:0, areas:{}}, M:{n:0, max:0, areas:{}}};
  for (let k = f0; k <= t0; k++){ const x = tOf(ui.year, k); for (const g of ['F','M']){
    const df = T.ist[g][x] - T.soll[g][x]; if (df < -0.5){ res[g].n++; res[g].max = Math.max(res[g].max, -df); }
    for (const ar of AREAS){ const da = st.ist[ar.c][g][x] - st.soll[ar.c][g][x]; if (da < -0.5) res[g].areas[ar.c] = Math.max(res[g].areas[ar.c] || 0, -da); } } }
  const top = g => Object.entries(res[g].areas).sort((x, y) => y[1] - x[1]);
  const topName = g => top(g).length ? AREA[top(g)[0][0]].k : 'mehrere Bereiche';
  const wk = t0 - f0 + 1;
  const line = (g, lab) => res[g].n ? `in <b>${res[g].n} von ${wk}</b> Wochen fehlen ${lab} (höchstens ${fmt(res[g].max)})${top(g).length ? ' – vor allem ' + top(g).slice(0, 3).map(([c, v]) => `${AREA[c].k} (${fmt(v)})`).join(', ') : ''}` : `genug ${lab} eingeplant`;
  let rec;
  if (res.F.n && res.M.n) rec = `Frauen und Männer fehlen – ein Paar passt: Frau → ${topName('F')}, Mann → ${topName('M')}.`;
  else if (res.M.n) rec = 'Es fehlen Männer – eher Männer anstellen. Bei einem Paar hätte die Frau zu wenig Arbeit.';
  else if (res.F.n) rec = 'Es fehlen Frauen – eher Frauen anstellen. Bei einem Paar hätte der Mann zu wenig Arbeit.';
  else rec = 'In diesem Zeitraum fehlt niemand.';
  const hire = `<div class="panel"><h3>Wen anstellen?</h3>
    <div class="toolbar"><label for="h-from">von KW <input class="inp" type="number" id="h-from" min="1" max="${n}" value="${f0}" style="width:64px"></label>
    <label for="h-to">bis KW <input class="inp" type="number" id="h-to" min="1" max="${n}" value="${t0}" style="width:64px"></label><span class="muted">${ui.year}</span></div>
    <p style="margin:10px 0 4px">Frauen: ${line('F', 'Frauen')}</p><p style="margin:4px 0">Männer: ${line('M', 'Männer')}</p>
    <p style="margin:10px 0 0;font-weight:700">${rec}</p></div>`;
  // Heatmap
  const hrow = (lab, arr, sub) => `<tr><td class="lbl${sub ? ' sub' : ''}">${lab}</td>${WK().map(x => { const v = arr[x]; return `<td class="num ${cls(v)}${x === now ? ' kwc' : ''}" data-pick-t="${x}">${Math.abs(v) < 0.05 ? '·' : fmtD(v)}</td>`; }).join('')}</tr>`;
  let hm = '';
  for (const ar of AREAS){ hm += `<tr class="sec"><td class="lbl" style="background:var(--${ar.c})">${ar.n}</td><td colspan="${n}"></td></tr>`;
    hm += hrow('Frauen', dif(st.ist[ar.c].F, st.soll[ar.c].F), 1) + hrow('Männer', dif(st.ist[ar.c].M, st.soll[ar.c].M), 1); }
  const heat = `<div class="panel"><h3>IST − SOLL pro Bereich <span class="n">· rot = es fehlen Leute, gelb = zu viele · Klick wählt die Woche</span></h3>
    <div class="gridwrap auto"><table class="xl">${weekHead('<th class="st0" style="min-width:230px;left:0">Bereich</th>', '<th class="st0" style="left:0"></th>')}<tbody>${hm}</tbody></table></div></div>`;
  // Bedarf eingeben
  const opts = [['BLU','Blumen'],['TOM','Tomaten'],['JUC','Kräuter Juch'],['FEL','Kräuter Feld'],['LOG','Logistik'],['FRE','Freiland (fixe Frauen)']];
  const ba = ui.bedArea, prev = d.jahre.find(j => j.y === ui.year - 1);
  const brow = (g, lab) => `<tr><td class="lbl">${lab}</td>${WK().map(x => `<td class="num${ed ? ' ed' : ''}${x === now ? ' kwc' : ''}" data-edit="soll|${ba}|${g}|${x}">${fmt(d.soll[ba][g][x] || 0)}</td>`).join('')}</tr>`;
  const bed = `<div class="panel"><h3>Bedarf eingeben ${ui.year}</h3><div class="toolbar"><label for="bed-a">Bereich <select id="bed-a">${opts.map(([c, l]) => opt(c, l, ba)).join('')}</select></label>
    <span class="muted">Eichhof und Freiland (gesamt) kommen aus ihren Blättern. Zahl anklicken und neue Zahl tippen, Tab = nächste Woche.</span>
    ${prev ? `<button class="btn" data-act="bed-vj"${ed ? '' : ' disabled'}>Bedarf ${prev.y} übernehmen</button><button class="btn" data-act="bed-vj-ist"${ed ? '' : ' disabled'}>Eingeplant ${prev.y} als Bedarf</button>` : ''}
    <span class="sp"></span>${lockNote('uebersicht')}</div>
    <div class="gridwrap auto" style="margin-top:8px"><table class="xl">${weekHead('<th class="st0" style="min-width:230px;left:0">Personen pro Woche</th>', '<th class="st0" style="left:0"></th>')}<tbody>
    ${brow('F', 'Frauen')}${ba !== 'FRE' ? brow('M', 'Männer') : ''}</tbody></table></div></div>`;
  return `<div class="sheet gut"><div class="stack"><div class="toolbar"><h2>Übersicht ${ui.year}</h2><span class="muted">KW ${ui.kw} (ab ${dmyT(t)})</span></div>
    ${tiles}${gtab}<div class="panel"><div class="toolbar" style="margin-bottom:8px"><h3 style="margin:0">Grafik</h3>${chips}</div>${charts2}</div>${hire}${heat}${bed}</div></div>`;
}

/* ---------- Blatt: Personalsitzung ---------- */
function candidates(st, t){
  const out = [];
  for (const a of AREAS){ if (a.c === 'EIC') continue; const df = st.ist[a.c].T[t] - st.soll[a.c].T[t];
    if (df > 0.5) for (const p of d.personen) if (p.w[t] === a.c) out.push({p, from:a.c, label:a.k}); }
  for (const g of GROUPS){ const df = st.grp[g.c][t] - (+d.bedarfEIC[g.c][t] || 0);
    if (df > 0.5) for (const p of d.personen) if (p.w[t] === 'EIC' && grpOf(p, t) === g.c) out.push({p, from:'EIC', label:'Eichhof · ' + g.n}); }
  return out;
}
function vSitzung(st){
  const t = tNow(), hr = can('sitzung'), T = st.tot;
  // 1 Lage
  let lage = '';
  for (const a of AREAS){
    const iF = st.ist[a.c].F[t], sF = st.soll[a.c].F[t], iM = st.ist[a.c].M[t], sM = st.soll[a.c].M[t];
    lage += `<tr><td><span class="hbchip k-${a.c}">${a.n}</span></td><td class="n">${fmt(sF)}</td><td class="n">${fmt(iF)}</td><td>${stTxt(iF - sF)}</td><td class="n">${fmt(sM)}</td><td class="n">${fmt(iM)}</td><td>${stTxt(iM - sM)}</td></tr>`;
    if (a.c === 'EIC') for (const g of GROUPS){ const b = +d.bedarfEIC[g.c][t] || 0, i = st.grp[g.c][t];
      lage += `<tr><td class="muted" style="padding-left:22px">${g.n}</td>${g.fm === 'F' ? `<td class="n muted">${fmt(b)}</td><td class="n muted">${fmt(i)}</td><td>${stTxt(i - b)}</td><td></td><td></td><td></td>` : `<td></td><td></td><td></td><td class="n muted">${fmt(b)}</td><td class="n muted">${fmt(i)}</td><td>${stTxt(i - b)}</td>`}</tr>`; } }
  lage += `<tr style="font-weight:700"><td>Gesamt</td><td class="n">${fmt(T.soll.F[t])}</td><td class="n">${fmt(T.ist.F[t])}</td><td>${stTxt(T.ist.F[t] - T.soll.F[t])}</td><td class="n">${fmt(T.soll.M[t])}</td><td class="n">${fmt(T.ist.M[t])}</td><td>${stTxt(T.ist.M[t] - T.soll.M[t])}</td></tr>`;
  const lent = d.personen.filter(p => p.hb && p.w[t] && !ABS.has(p.w[t]) && !p.w[t].split('/').includes(p.hb));
  const lentRows = lent.length ? lent.map(p => `<tr><td>${esc(name(p))}</td><td>${AREA[p.hb].k}</td><td>→ ${esc(areaTxt(p.w[t]))}</td></tr>`).join('') : '<tr><td colspan="3" class="muted">Niemand ist diese Woche ausgeliehen.</td></tr>';
  // 2 Mutationen
  const ein = d.personen.filter(p => inWeek(p.ein, t)), aus = d.personen.filter(p => inWeek(p.aus, t));
  const neuAbs = d.personen.filter(p => ABS.has(p.w[t]) && p.w[t - 1] !== p.w[t]);
  const aus4 = d.personen.filter(p => p.aus && p.aus > iso(addDays(monT(t), 6)) && p.aus <= iso(addDays(monT(t), 34))).sort((a, b) => a.aus < b.aus ? -1 : 1);
  const plist = (arr, f) => arr.length ? arr.map(f).join('') : '<li class="muted">–</li>';
  const mut = d.mut.filter(m => m.t === t);
  const mutRows = mut.length ? mut.map(m => `<tr><td>${esc(m.typ)}</td><td>${esc(m.pid && P(d, m.pid) ? name(P(d, m.pid)) : m.name)}</td><td>${m.area ? `<span class="hbchip k-${m.area}">${AREA[m.area] ? AREA[m.area].k : esc(m.area)}</span>` : ''}</td><td>${esc(m.bem)}</td><td>${esc(m.von)}</td><td>${esc(fmtDate(m.buero) || m.buero)}</td>
    <td>${hr ? `<button class="del" data-act="mut-del" data-id="${m.id}" aria-label="Eintrag löschen">×</button>` : ''}</td></tr>`).join('') : '<tr><td colspan="7" class="muted">Keine Einträge in dieser Woche.</td></tr>';
  const mutForm = hr ? `<div class="toolbar" style="margin-top:8px">
    <label for="mu-typ">Was <select id="mu-typ" class="inp">${MUT_TYPEN.map(x => opt(x, x, 'Absenzen')).join('')}</select></label>
    <label for="mu-p">Person <select id="mu-p" class="inp"><option value="">– wählen –</option>${personOptions('')}</select></label>
    <label for="mu-b" style="flex:1;min-width:160px">Bemerkung <input id="mu-b" class="inp" style="flex:1"></label>
    <label for="mu-d">1. Bürotag <input id="mu-d" class="inp" type="date"></label>
    <button class="btn primary" data-act="mut-add">Eintragen</button></div>` : '';
  // 3 Anfragen, Aushelfen
  const need = AREAS.map(a => ({a, df:st.ist[a.c].T[t] - st.soll[a.c].T[t]})).filter(x => x.df < -0.5).sort((x, y) => x.df - y.df);
  const cands = candidates(st, t).slice(0, 40);
  const candRows = cands.length ? cands.map(({p, from, label}) => `<tr><td>${esc(name(p))}</td><td>${p.fm}</td><td>${esc(label)}</td>
    <td><select class="inp" data-cand-to="${p.id}" aria-label="Ziel für ${esc(name(p))}">${AREAS.filter(a => a.c !== from).map(a => opt(a.c, a.k, need.length ? need[0].a.c : '')).join('')}</select></td>
    <td><label class="xs"><input type="checkbox" data-cand-half="${p.id}"> halb</label></td>
    <td><button class="btn" data-act="assign" data-p="${p.id}" data-from="${from}"${hr ? '' : ' disabled'}>Zuteilen</button></td></tr>`).join('')
    : `<tr><td colspan="6" class="muted">In KW ${ui.kw} hat kein Bereich zu viele Leute.</td></tr>`;
  const reqs = d.anfragen.filter(r => r.t >= t - 1).sort((x, y) => x.t - y.t);
  const reqRows = reqs.length ? reqs.map(r => `<tr><td><span class="hbchip k-${r.area}">${AREA[r.area].k}</span></td><td>${kwLbl(r.t)}</td><td>${r.n} ${r.fm === 'F' ? 'Frauen' : r.fm === 'M' ? 'Männer' : 'Personen'}</td>
    <td>${esc(r.text)}<div class="xs">${esc(r.von)}</div></td><td>${r.st === 'offen' ? '<span class="st warn">offen</span>' : '<span class="st ok">✓ erledigt</span>'}</td>
    <td><button class="btn" data-act="req-toggle" data-id="${r.id}"${hr ? '' : ' disabled'}>${r.st === 'offen' ? 'Erledigt' : 'Öffnen'}</button></td></tr>`).join('') : '<tr><td colspan="6" class="muted">Keine Anfragen.</td></tr>';
  const myArea = ui.role === 'kr' ? 'EIC' : ui.role === 'ge' ? 'FRE' : 'BLU';
  const reqForm = `<div class="toolbar" style="margin-top:10px">
    <label for="rq-a">Bereich <select id="rq-a" class="inp">${AREAS.map(a => opt(a.c, a.k, myArea)).join('')}</select></label>
    <label for="rq-kw">KW <input id="rq-kw" class="inp" type="number" min="1" max="${Y().n}" value="${ui.kw}" style="width:60px"></label>
    <label for="rq-n">Anzahl <input id="rq-n" class="inp" type="number" min="1" max="30" value="1" style="width:56px"></label>
    <label for="rq-fm">Wer <select id="rq-fm" class="inp"><option value="F">Frauen</option><option value="M">Männer</option><option value="X">egal</option></select></label>
    <label for="rq-t" style="flex:1;min-width:160px">Grund <input id="rq-t" class="inp" style="flex:1" placeholder="z.B. Pikieren"></label>
    <button class="btn primary" data-act="req-add">Anfrage senden</button></div>`;
  // 4 Bewerber
  const bewRows = d.bew.length ? d.bew.map(b => `<tr><td>${esc(b.vn)} ${esc(b.nn)}</td><td>${esc(b.fm)}</td><td>${esc(b.partner)}</td><td>${b.wunsch ? AREA[b.wunsch].k : ''}</td><td>${b.ab ? 'KW ' + b.ab : ''}</td><td>${esc(b.bem)}</td>
    <td><select class="inp" data-bew-st="${b.id}"${hr ? '' : ' disabled'} aria-label="Status">${BEW_ST.map(s => opt(s, s, b.st)).join('')}</select></td>
    <td>${hr && b.st !== 'angelegt' ? `<button class="btn" data-act="bew-anlegen" data-id="${b.id}">Anlegen</button>` : ''}${hr ? `<button class="del" data-act="bew-del" data-id="${b.id}" aria-label="Löschen">×</button>` : ''}</td></tr>`).join('') : '<tr><td colspan="8" class="muted">Noch keine Bewerberinnen und Bewerber.</td></tr>';
  const bewForm = hr ? `<div class="toolbar" style="margin-top:8px">
    <label for="bw-vn">Vorname <input id="bw-vn" class="inp" style="width:110px"></label><label for="bw-nn">Nachname <input id="bw-nn" class="inp" style="width:120px"></label>
    <label for="bw-fm">F/M <select id="bw-fm" class="inp"><option>F</option><option>M</option></select></label>

  // Traktanden
  const trak = d.trakt.map((x, i) => `<tr><td class="${hr ? 'ed-t' : ''}" data-tedit="trakt|${i}|nr">${esc(x.nr)}</td><td data-tedit="trakt|${i}|titel">${esc(x.titel)}</td><td data-tedit="trakt|${i}|mod">${esc(x.mod)}</td><td data-tedit="trakt|${i}|min" class="n">${esc(x.min)}</td>

  const wn = d.wnotes[t] || {};
  const notes = AREAS.concat([{c:'ALL', n:'Allgemein'}]).map(a => { const mine = can('sitzung') || (a.c === 'EIC' && ui.role === 'kr') || (a.c === 'FRE' && ui.role === 'ge');
    return `<label class="xs" for="wn-${a.c}">${a.n}</label><textarea id="wn-${a.c}" class="inp" data-wnote="${a.c}" rows="2" style="width:100%;box-sizing:border-box"${mine ? '' : ' disabled'}>${esc(wn[a.c] || '')}</textarea>`; }).join('');

      ${hr ? '<div class="toolbar" style="margin-top:6px"><button class="btn" data-act="trakt-add">+ Traktandum</button><span class="xs">Feld anklicken zum Ändern</span></div>' : ''}
      <div class="secnav" style="margin-top:8px"><a href="#s-lage">1 Über-/Unterbesetzung</a><a href="#s-mut">2 Mutationen</a><a href="#s-plan">3 Bedarf / Planung</a><a href="#s-bew">4 Bewerberliste</a><a href="#s-not">5 Notizen und Protokoll</a></div></div>
    <div class="cols">
      <div class="panel" id="s-lage"><h3>1 Über-/Unterbesetzung KW ${ui.kw}</h3><div class="tw"><table class="plain"><thead><tr><th>Bereich</th><th class="n">Frauen Bedarf</th><th class="n">eingeplant</th><th></th><th class="n">Männer Bedarf</th><th class="n">eingeplant</th><th></th></tr></thead><tbody>${lage}</tbody></table></div>
        <h3 style="margin-top:14px">Ausgeliehen in KW ${ui.kw} <span class="n">(${lent.length})</span></h3><div class="tw"><table class="plain"><thead><tr><th>Name</th><th>Hauptbereich</th><th>arbeitet bei</th></tr></thead><tbody>${lentRows}</tbody></table></div></div>
      <div class="panel" id="s-mut"><h3>2 Mutationen KW ${ui.kw}</h3>
        <div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
          <div><b class="xs">Eintritte (${ein.length})</b><ul class="xs" style="margin:4px 0;padding-left:16px">${plist(ein, p => `<li>${esc(name(p))} · ${p.hb ? AREA[p.hb].k : ''}</li>`)}</ul></div>

          <div><b class="xs">Austritte nächste 4 Wochen (${aus4.length})</b><ul class="xs" style="margin:4px 0;padding-left:16px">${plist(aus4, p => `<li>${esc(name(p))} · ${fmtDate(p.aus)}</li>`)}</ul></div></div>
        <h3 style="margin-top:10px">Eingetragene Mutationen</h3><div class="tw"><table class="plain"><thead><tr><th>Was</th><th>Person</th><th>Bereich</th><th>Bemerkung</th><th>Notiert von</th><th>1. Bürotag</th><th></th></tr></thead><tbody>${mutRows}</tbody></table></div>${mutForm}</div>

      if (!gv) lanes[''].act.push({p, s});

        if (home && !gp.includes(home) && lanes[home]) lanes[home].grey.push({p, why:'diese Woche bei ' + grpName(gv), kind:'grp'}); }
      continue; }
    if (!related(p)) continue;
    const lane = lanes[home] ? home : '';
    if (c && ABS.has(c)) lanes[lane].grey.push({p, why:STN[c], kind:'abs'});
    else if (c) lanes[lane].grey.push({p, why:'bei ' + areaTxt(c), kind:'away'});

function moveCard(pid, from, kind, to){

    const weeks = ui.krScope === 'bis' ? scopeWeeks(p0, t, false) : [t];
    const lbl = rangeLbl(weeks[0], weeks[weeks.length - 1]);

    toast(`${name(p0)}: Ferien ${lbl}.`, 'Krank', () => commit(`${name(p0)}: Krank ${lbl}`, dd => { const p = P(dd, pid); for (const k of weeks) p.w[k] = 'K'; })); return; }
  if (kind === 'abs' || kind === 'leer'){ const weeks = ui.krScope === 'bis' ? scopeWeeks(p0, t, false) : [t];
    commit(`${name(p0)}: ${GROUP[to].n} ${rangeLbl(weeks[0], weeks[weeks.length - 1])}`, dd => { const p = P(dd, pid); for (const k of weeks){ if (!p.w[k] || ABS.has(p.w[k])) p.w[k] = 'EIC'; (dd.gw[pid] ||= {})[k] = to; } }); return; }
  if (from === '' && kind === 'act'){ commit(`${name(p0)}: fest in Gruppe ${GROUP[to].n}`, dd => { P(dd, pid).g = to; }); toast(`${name(p0)} ist jetzt fest in ${GROUP[to].n}.`); return; }
  const weeks = scopeWeeks(p0, t);
  commit(`${name(p0)}: ${GROUP[from] ? GROUP[from].n : grpName(grpOf(p0, t))} → ${GROUP[to].n} (${rangeLbl(weeks[0], weeks[weeks.length - 1])})`, dd => {

      (dd.gw[pid] ||= {})[k] = nv; } });
}

function savePerson(){
  const pid = +drawer.dataset.pid || null, bewId = +drawer.dataset.bew || null;
  const f = {vn:$('#p-vn').value.trim(), nn:$('#p-nn').value.trim(), badge:$('#p-badge').value.trim(), fm:$('#p-fm').value, hb:$('#p-hb').value,
    g:$('#p-g').value, ein:$('#p-ein').value || null, aus:$('#p-aus').value || null, zu:$('#p-zu').value, fs:$('#p-fs').value.trim(), fn:$('#p-fn').value.trim(), bem:$('#p-bem').value.trim()};
  const paId = +$('#p-pa').value || null, fill = $('#p-fill').checked, clr = !!$('#p-clear') && $('#p-clear').checked;
  if (!f.vn || !f.nn){ toast('Bitte Vor- und Nachname eintragen.'); return; }
  if (f.ein && f.aus && f.aus < f.ein){ toast('Der Austritt liegt vor dem Eintritt.'); return; }
  const label = `${f.vn} ${f.nn}`;
  commit(pid ? `${label}: Angaben geändert` : `Neue Person: ${label} (${AREA[f.hb].k}${f.ein ? ', ab ' + fmtDate(f.ein) : ''})`, dd => {
    let p;
    if (pid){ p = P(dd, pid); Object.assign(p, f); }
    else { p = {id:dd.nextId++, pa:null, w:new Array(dd.T).fill(''), ...f}; dd.personen.push(p); }
    const oldPartner = p.pa ? dd.personen.find(o => o.pa === p.pa && o.id !== p.id) : null;
    if (paId !== (oldPartner ? oldPartner.id : null)){
      if (!paId) p.pa = null;
      else { const o = P(dd, paId); const num = o.pa || (Math.max(0, ...dd.personen.map(x => x.pa || 0)) + 1); o.pa = num; p.pa = num; } }
    if (fill && (p.ein || p.aus)){ const ye = p.aus ? null : dd.jahre.find(j => j.y === +(p.ein || '').slice(0, 4));
      for (let t = 0; t < dd.T; t++) if (!p.w[t] && inContract(p, t) && (!ye || t < ye.off + ye.n)) p.w[t] = p.hb; }
    if (clr) for (let t = 0; t < dd.T; t++) if (p.w[t] && !ABS.has(p.w[t]) && !inContract(p, t)) p.w[t] = '';
    if (bewId){ const b = dd.bew.find(x => x.id === bewId); if (b) b.st = 'angelegt'; }
  });
  drawer.hidden = true; toast(pid ? 'Gespeichert.' : `${label} hinzugefügt.`);
}

function getVal(path){ const p = path.split('|');
  switch (p[0]){ case 'std': return d.stunden[+p[1]].v[+p[2]]; case 'stdt': return d.stunden[+p[1]].t; case 'bed': return d.bedarfEIC[p[1]][+p[2]];
    case 'soll': return d.soll[p[1]][p[2]][+p[3]]; case 'vj': return d.vj[+p[1]]; case 'krank': return d.krank[+p[1]];

  switch (p[0]){ case 'std': dd.stunden[+p[1]].v[+p[2]] = v; break; case 'stdt': dd.stunden[+p[1]].t = v; break; case 'bed': dd.bedarfEIC[p[1]][+p[2]] = v; break;

    case 'trakt': dd.trakt[+p[1]][p[2]] = v; break;
    case 'auf': { const r = dd.aufgaben[+p[1]], k = p[2]; if (k[0] === 't' && k.length === 2) r.tage[+k[1]] = v; else r[k] = v; break; } } }

view.addEventListener('input', e => { const t = e.target;
  if (t.id === 'q'){ ui.q = t.value; const pos = t.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); } });
view.addEventListener('change', e => { const t = e.target, tw = tNow();
  if (t.id === 'show'){ ui.show = t.value; render(); }
  else if (t.id === 'hb'){ ui.hb = t.value; render(); }
  else if (t.id === 'fmf'){ ui.fm = t.value; render(); }
  else if (t.id === 'zu'){ ui.zu = t.value; render(); }
  else if (t.id === 'h-from'){ ui.hireFrom = +t.value || 1; render(); }
  else if (t.id === 'h-to'){ ui.hireTo = +t.value || Y().n; render(); }
  else if (t.id === 'bed-a'){ ui.bedArea = t.value; render(); }
  else if (t.id === 'kr-bis'){ ui.krBis = Math.max(ui.kw, Math.min(Y().n, +t.value || ui.kw)); render(); }
  else if (t.id === 'std'){ const v = Math.max(20, Math.min(70, +t.value || 52)); commit(`Stunden pro Person: ${v}`, dd => { dd.std = v; }); }
  else if (t.id === 'm-prot'){ const v = t.value; commit(`Protokoll Personalsitzung ${kwLbl(tw)}`, dd => { dd.sitzung[tw] = v; }); }
  else if (t.dataset.wnote){ const ar = t.dataset.wnote, v = t.value; commit(`Notiz ${ar === 'ALL' ? 'allgemein' : AREA[ar].k} ${kwLbl(tw)}`, dd => { (dd.wnotes[tw] ||= {})[ar] = v; }); }
  else if (t.dataset.bewSt){ const id = +t.dataset.bewSt, v = t.value; commit(`Bewerbung Status: ${v}`, dd => { const b = dd.bew.find(x => x.id === id); if (b) b.st = v; }); }
});
drawer.addEventListener('input', e => { if (e.target.id === 'log-q') renderLog(e.target.value); });
view.addEventListener('dragstart', e => { const c = e.target.closest('[data-card]'); if (!c) return; closePop(); e.dataTransfer.setData('text/plain', `${c.dataset.card}|${c.dataset.lane}|${c.dataset.kind}`); e.dataTransfer.effectAllowed = 'move'; });
view.addEventListener('dragover', e => { const l = e.target.closest('[data-drop]'); if (!l) return; e.preventDefault(); document.querySelectorAll('.lane.over').forEach(x => x !== l && x.classList.remove('over')); l.classList.add('over'); });
view.addEventListener('dragleave', e => { const l = e.target.closest('[data-drop]'); if (l && !l.contains(e.relatedTarget)) l.classList.remove('over'); });
view.addEventListener('drop', e => { const l = e.target.closest('[data-drop]'); if (!l) return; e.preventDefault(); l.classList.remove('over');
  const [pid, from, kind] = e.dataTransfer.getData('text/plain').split('|'); moveCard(+pid, from, kind, l.dataset.drop); });
function stepWeek(dir){ let i = d.jahre.findIndex(j => j.y === ui.year), kw = ui.kw + dir;
  if (kw < 1 && i > 0){ i--; kw = d.jahre[i].n; } else if (kw > d.jahre[i].n && i < d.jahre.length - 1){ i++; kw = 1; }
  ui.year = d.jahre[i].y; ui.kw = Math.max(1, Math.min(d.jahre[i].n, kw)); closePop(); render(); }
$('#kw-prev').onclick = () => d && stepWeek(-1);
$('#kw-next').onclick = () => d && stepWeek(1);
$('#yr-sel').onchange = e => { ui.year = +e.target.value; ui.kw = Math.min(ui.kw, Y().n); closePop(); render(); };
$('#b-undo').onclick = () => { if (!past.length) return; future.push(JSON.stringify(d)); d = JSON.parse(past.pop()); queueSave({replace:true, fn:() => {}}); render(); toast('Rückgängig gemacht'); };
$('#b-redo').onclick = () => { if (!future.length) return; past.push(JSON.stringify(d)); d = JSON.parse(future.pop()); queueSave({replace:true, fn:() => {}}); render(); toast('Wiederhergestellt'); };
$('#b-log').onclick = () => d && openLog();
document.addEventListener('keydown', e => {
  const inField = e.target.closest('input,textarea,select');
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !inField){ e.preventDefault(); $('#b-undo').click(); }
  else if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z')) && !inField){ e.preventDefault(); $('#b-redo').click(); }
  else if (e.key === 'Escape'){ if (!pop.hidden) closePop(); else if (!drawer.hidden) drawer.hidden = true; }
  else if (e.key === 'Enter' && !pop.hidden && popState && !e.target.closest('textarea')){ e.preventDefault(); applyPop(false); }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (d && TABS.some(t => t.id === h) && h !== ui.tab){ ui.tab = h; closePop(); render(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkRemote(); });
showStart();
</script>
</body>
</html>
